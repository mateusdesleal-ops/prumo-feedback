<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123D3B">
<title>Prumo Feedback · Testes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prumo Feedback">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: premium, sóbrio, confiável — app de rotina do líder
   IDEA: um caderno de liderança com uma sala de treino dentro
   PICTURE: a chamada do Simula (avatar animado, onda de voz) e o dashboard com recomendações
   COLOUR and TYPE: verde-petróleo, off-white, dourado só em detalhes; Inter
   LAYOUT: coluna de app (máx. 480px) com barra inferior; no desktop centralizada sobre o verde */
:root{color-scheme:light dark;
--pet:#123D3B;--ver:#39766A;--our:#C4A46B;
--bg:light-dark(#F7F7F3,#0F1716);--sf:light-dark(#FFFFFF,#172321);--sf2:light-dark(#EEF0EA,#1E2D2A);
--ink:light-dark(#202725,#ECEDE8);--mut:light-dark(#5E6864,#A2ACA8);--line:light-dark(#DFE2DB,#2B3A37);
--pri:light-dark(#123D3B,#7FC0B2);--prit:light-dark(#FFFFFF,#0F1716);--acc:light-dark(#7A5E2E,#D6B97E);
--ok:light-dark(#2F7A4F,#6FCF97);--warn:light-dark(#9A5B12,#F2B66B);--bad:light-dark(#B23A32,#F08A82);
--chip:light-dark(#E4EEEA,#20332F)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--pet);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:600px){body{padding:24px 0}#app{min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px -30px #000b}}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:12px 16px;min-height:60px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;padding:16px 16px 110px}
nav.tabs{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;color:var(--mut);font:500 11.5px Inter,sans-serif;display:grid;justify-items:center;gap:3px;padding:6px 0;min-height:52px;cursor:pointer;border-radius:12px}
nav.tabs button.on{color:var(--pri)}
nav.tabs button.on svg{stroke-width:2.2}
nav.tabs .sim svg{background:var(--pet);stroke:#F7F7F3;border-radius:12px;padding:5px;width:34px;height:30px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font-size:22px;line-height:1.15;margin:0 0 4px;letter-spacing:-.02em}
h3{font-size:16.5px;margin:0;letter-spacing:-.01em}
p{margin:0}
.mut{color:var(--mut)}.sm{font-size:13.5px}.xs{font-size:12.5px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h3{font-size:15px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px}
.card+.card{margin-top:10px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:56px}
.row .grow{flex:1}
.row .chev{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:0;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--pri);color:var(--prit);text-decoration:none}
.btn.gold{background:var(--our);color:#1d1a12}
.btn.ghost{background:var(--sf2);color:var(--ink)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--sf2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--our);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:500;margin-bottom:12px}
input,select,textarea{font:16px Inter,sans-serif;width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:99px;padding:8px 14px;font:500 14px Inter,sans-serif;cursor:pointer;min-height:38px}
.chip.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--pri);white-space:nowrap}
.tag.w{background:light-dark(#FBEBD5,#3a2c17);color:var(--warn)}
.tag.b{background:light-dark(#F8DEDB,#3c201e);color:var(--bad)}
.tag.o{background:light-dark(#DDF0E4,#183427);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.kpi b{display:block;font-size:22px;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--mut);line-height:1.2;display:block;margin-top:3px}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa button{background:none;border:0;color:var(--ink);font:500 12px Inter,sans-serif;display:grid;justify-items:center;gap:6px;cursor:pointer;padding:4px 0;line-height:1.2}
.qa button span.c{width:52px;height:52px;border-radius:16px;background:var(--chip);display:grid;place-items:center;color:var(--pri)}
.hello{background:var(--pet);color:#F7F7F3;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hello .mut{color:#B9CBC5}
.hello q{display:block;margin-top:14px;padding-top:14px;border-top:1px solid #ffffff22;font-size:15px;quotes:none;color:#E8EFEC}
.hello .lg{position:absolute;right:-20px;top:-10px;width:120px;height:150px;color:#ffffff0d}
.simcta{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1A4A46,#123D3B);color:#F7F7F3;border-radius:18px;padding:16px;border:0;width:100%;text-align:left;font:inherit;cursor:pointer}
.simcta .mut{color:#B9CBC5}
.rec{display:flex;gap:12px;align-items:flex-start}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--our);margin-top:7px;flex:none}
.av{border-radius:50%;flex:none;background:var(--sf2);display:grid;place-items:center;font-weight:700;color:var(--pri);overflow:hidden}
.prog{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden}.prog i{display:block;height:100%;background:var(--ver);border-radius:4px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative;margin-bottom:12px}
.tl .it::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--sf);border:2px solid var(--ver)}
.empty{text-align:center;padding:28px 16px;color:var(--mut)}
.empty svg{width:40px;height:40px;stroke:var(--mut);margin-bottom:8px}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:600 13.5px Inter,sans-serif;padding:9px 4px;border-radius:9px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px #0002}
.out{white-space:pre-wrap;line-height:1.6}
.ai{border-left:3px solid var(--our);padding-left:12px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.msg.u{align-self:flex-end;background:var(--pri);color:var(--prit);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--sf);border:1px solid var(--line);border-bottom-left-radius:5px}
.composer{position:sticky;bottom:72px;background:var(--bg);padding:10px 0 4px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:140px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 8px 24px #0004}
.sheet{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
/* call */
.call{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#183F3C,#0B1F1D);color:#F7F7F3;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
@media(min-width:600px){.call{top:24px;bottom:24px;border-radius:28px;overflow:hidden}}
.call .bar{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:13.5px;color:#B9CBC5}
.call .bar .live{display:inline-flex;align-items:center;gap:6px;background:#ffffff14;padding:4px 10px;border-radius:99px}
.call .bar .live i{width:8px;height:8px;border-radius:50%;background:#6FCF97}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;position:relative;min-height:0}
.stage.video{justify-content:flex-start}
.avbig{width:150px;height:150px;position:relative}
.avbig::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--our);opacity:0}
.speaking .avbig::after{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.2);opacity:0}}
.vframe{width:100%;aspect-ratio:3/4;max-height:52vh;border-radius:20px;background:linear-gradient(180deg,#d9dfdb,#b9c3be);overflow:hidden;position:relative}
.vframe svg{width:100%;height:100%}
.vframe .self{position:absolute;right:10px;bottom:10px;width:84px;height:112px;border-radius:12px;background:#0B1F1D;border:2px solid #ffffff33;display:grid;place-items:center;font-size:11px;color:#9FB0AB;text-align:center;padding:6px}
.head{transform-origin:50% 80%;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(0)}30%{transform:rotate(1.2deg)}60%{transform:rotate(-1deg) translateY(1px)}}
.eye{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth{transform-origin:center;transform-box:fill-box;transition:transform .08s}
.speaking .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
.wave{display:flex;gap:4px;align-items:center;height:40px;margin:14px 0}
.wave i{width:4px;height:6px;border-radius:2px;background:#ffffff40}
.speaking .wave i{background:var(--our);animation:w 1s ease-in-out infinite}
.listening .wave i{background:#6FCF97;animation:w .8s ease-in-out infinite}
@keyframes w{0%,100%{height:6px}50%{height:34px}}
.caption{width:100%;background:#00000040;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;min-height:64px;color:#E8EFEC}
.caption b{color:var(--our)}
.ctrls{display:flex;justify-content:center;gap:14px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));flex-wrap:wrap}
.cb{width:60px;height:60px;border-radius:50%;border:0;background:#ffffff1c;color:#fff;display:grid;place-items:center;cursor:pointer}
.cb.on{background:#F7F7F3;color:#123D3B}
.cb.mic{width:76px;height:76px;background:var(--our);color:#1d1a12}
.cb.mic.rec{background:#6FCF97}
.cb.end{background:#C2473F}
.cb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cblab{font-size:11.5px;color:#B9CBC5;text-align:center;margin-top:4px}
.call input{background:#0c2422;border-color:#ffffff33;color:#F7F7F3}
.score{font-size:56px;font-weight:700;line-height:1;color:var(--pri)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:14.5px}
.crit .prog{grid-column:1/-1}
.crit em{font-style:normal;color:var(--mut);white-space:nowrap}
.cardvis{border-radius:18px;padding:22px;background:var(--pet);color:#F7F7F3;position:relative;overflow:hidden}
.cardvis .lg{position:absolute;right:-16px;bottom:-24px;width:110px;height:140px;color:#C4A46B30}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:13px}
.cal .d{padding:8px 0;border-radius:10px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;position:relative;min-height:40px}
.cal .d.t{background:var(--pri);color:var(--prit);font-weight:700}
.cal .d.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--our)}
.cal .d.x{opacity:.35}
.lesson{line-height:1.7;font-size:16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px}
.opt.right{border-color:var(--ok);background:light-dark(#E2F3E8,#183427)}
.opt.wrong{border-color:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ob{min-height:100%;display:flex;flex-direction:column;padding:24px 20px}
.ob .steps{display:flex;gap:6px;margin-bottom:24px}.ob .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.ob .steps i.on{background:var(--our)}
.brandrow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brandrow b{color:var(--acc);font-weight:500}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;min-height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--ver)}
.switch input:checked+span::after{transform:translateX(20px)}
.bars .r{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.bars .r em{font-style:normal;text-align:right;color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);background:var(--sf2);border-radius:10px;padding:8px 10px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hint{font-size:12.5px;line-height:1.45;color:var(--mut);font-weight:400}
.dyn{display:block;font-size:13.5px;line-height:1.5;font-weight:400;color:var(--ink);background:var(--chip);border-left:3px solid var(--our);border-radius:8px;padding:9px 11px}
.dyn:empty{display:none}
.qi{width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font:700 12.5px Inter,sans-serif;display:inline-grid;place-items:center;cursor:pointer;padding:0;vertical-align:middle;position:relative}
.qi::after{content:"";position:absolute;inset:-11px}
.intro{border-color:var(--our);background:light-dark(#FBF6EC,#221F17);margin-bottom:14px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;text-align:left}
input::-webkit-date-and-time-value{text-align:left}

.chip.on[style*=background]{outline:3px solid var(--our);outline-offset:2px}

/* ---------- computador ---------- */
aside.side{display:none}
@media(min-width:700px) and (max-width:1023px){#app{max-width:760px}}
@media(min-width:1024px){
 body{padding:0;background:var(--bg)}
 #app{max-width:none;min-height:100vh;border-radius:0;box-shadow:none;overflow:visible}
 #app.shell{display:grid;grid-template-columns:264px minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start}
 #app.shell nav.tabs{display:none}
 aside.side{display:flex;flex-direction:column;grid-row:1/3;grid-column:1;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--pet);color:#E8EFEC;padding:18px 12px;gap:2px}
 .sbrand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#F7F7F3;padding:4px 10px 18px}
 .sbrand b{color:#C4A46B;font-weight:500}
 aside.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
 .si{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#D5E0DC;font:500 14.5px Inter,sans-serif;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;min-height:40px}
 .si:hover{background:#ffffff12;color:#fff}
 .si.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 #C4A46B}
 .si svg.i{width:19px;height:19px}
 .si small{color:#9FB0AB;font-size:12px}
 .si .av{background:#ffffff22;color:#C4A46B}
 .sgrp{font-size:11.5px;font-weight:600;color:#8FA6A0;margin:16px 12px 4px;letter-spacing:.02em}
 .sfoot{border-top:1px solid #ffffff1f;padding-top:12px;margin-top:12px;display:grid;gap:8px}
 .sseg{background:#ffffff14;margin:0}.sseg button{color:#C9D6D2}.sseg button.on{background:#F7F7F3;color:#123D3B}
 #app.shell header.top{grid-column:2;padding:16px 40px;min-height:68px}
 #app.shell header.top h1{font-size:22px}
 #app.shell .hdlogo{display:none!important}
 #app.shell main{grid-column:2;padding:28px 40px 56px;width:100%;max-width:1180px}
 .kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))!important}
 .kpi{padding:16px 10px}.kpi b{font-size:28px}
 .qa{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
 #app.shell main .list{grid-template-columns:repeat(2,minmax(0,1fr))}
 #app.shell main .tl .list,#app.shell main .chat{grid-template-columns:none}
 .hello{padding:26px 28px}.hello h2{font-size:28px}
 label.f,.card textarea{max-width:none}
 .composer{bottom:0}
 .toast{bottom:32px}
 .call{top:4vh;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:460px;height:92vh;border-radius:28px;overflow:hidden;box-shadow:0 0 0 100vmax #0009,0 30px 80px #000a}
 .sheet{align-items:center}
 .sheet>div{border-radius:22px;max-width:560px;padding:26px}
 .ob{max-width:520px;margin:0 auto;padding-top:8vh;min-height:auto}
 #app:not(.shell){display:block}
}

/* ================= TEMA "CLARO" (v2) =================
   VOICE: claro, leve, confiável — painel de pessoas moderno
   COLOUR: fundo cinza-gelo, cartões brancos, ameixa (marca), coral (destaque), verde-água (progresso)
   TYPE: Inter; títulos com peso 700, números grandes nos indicadores */
:root{
--plum:light-dark(#4A2D5E,#C9A8E0);--coral:light-dark(#E8604C,#F58C7A);--teal:light-dark(#22A894,#4FD1BC);--blue:light-dark(#3B82C4,#6FB0EA);--mag:light-dark(#C92A62,#F07AA3);
--pet:#4A2D5E;--ver:var(--teal);--our:var(--coral);
--bg:light-dark(#F4F5F8,#121217);--sf:light-dark(#FFFFFF,#1C1C24);--sf2:light-dark(#EEF0F4,#262630);
--ink:light-dark(#1F2333,#ECECF1);--mut:light-dark(#6A6F80,#A4A7B5);--line:light-dark(#E5E7ED,#2E2E3A);
--pri:var(--plum);--prit:light-dark(#FFFFFF,#16121B);--acc:var(--coral);
--chip:light-dark(#F1ECF5,#2A2233);
--sh:0 1px 2px light-dark(#1f23330a,#0006),0 6px 20px light-dark(#1f23330d,#0004);

body{background:var(--bg)}
@media(min-width:600px) and (max-width:1023px){body{background:light-dark(#E9EBF1,#0b0b0f)}}
header.top{background:color-mix(in srgb,var(--sf) 94%,transparent);border-bottom:1px solid var(--line)}
header.top h1{font-weight:700}
.card,.row,.kpi{border:1px solid var(--line);box-shadow:var(--sh)}
.card{border-radius:18px}
.row{border-radius:16px}
.row:hover,.kpi:hover{border-color:color-mix(in srgb,var(--plum) 30%,var(--line))}
.kpi{border-radius:16px;position:relative;overflow:hidden}
.kpi b{color:var(--plum);font-weight:700}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);opacity:.85}
.btn{border-radius:10px}
.btn.gold{background:var(--coral);color:#fff}
.btn.line{box-shadow:inset 0 0 0 1.5px light-dark(#D5D8E0,#3a3a48)}
.chip.on{background:var(--plum);border-color:var(--plum)}
.tag{background:var(--chip);color:var(--plum);border-radius:6px;font-weight:600;letter-spacing:.01em}
.qa button span.c{background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh);color:var(--plum)}
.qa button:nth-child(4n+2) span.c{color:var(--coral)}.qa button:nth-child(4n+3) span.c{color:var(--teal)}.qa button:nth-child(4n) span.c{color:var(--blue)}
.prog{height:10px;border-radius:6px;background:var(--sf2)}.prog i{background:var(--teal);border-radius:6px}
.prog.g i{background:var(--grad)}
nav.tabs{background:var(--sf);box-shadow:0 -4px 20px light-dark(#1f23330d,#0005)}
nav.tabs button.on{color:var(--plum)}
nav.tabs .sim svg{background:var(--grad);stroke:#fff}
.seg button.on{color:var(--plum)}
.msg.u{background:var(--plum)}
.dyn{border-left-color:var(--coral)}
.intro{border-color:light-dark(#EBD9F2,#3b2d47);background:light-dark(#FBF8FD,#1f1a26)}
.rec .dot{background:var(--coral)}
.note{background:var(--sf2)}
.cal .d.has::after{background:var(--coral)}
.tl .it::before{border-color:var(--teal)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline-color:color-mix(in srgb,var(--plum) 55%,transparent)}
input,select,textarea{border-color:light-dark(#DADDE5,#34343f)}
input:focus,select:focus,textarea:focus{border-color:var(--plum)}
.ob .steps i.on{background:var(--grad)}
.brandrow b{color:var(--coral)}
.switch input:checked+span{background:var(--plum)}
.ai{border-left-color:var(--coral)}
/* avatares coloridos */
.av{color:#fff;background:var(--plum)}
.av.c1{background:#22A894}.av.c2{background:#E8604C}.av.c3{background:#3B82C4}.av.c4{background:#C92A62}.av.c5{background:#E0A030}.av.c0{background:#6A3F86}
.av{box-shadow:0 0 0 2px var(--sf)}
/* saudação (cartão branco) */
.hello{background:var(--sf);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.hello .mut{color:var(--mut)}
.hello q{border-top-color:var(--line);color:var(--ink)}
.hello .lg{color:light-dark(#4A2D5E0d,#ffffff0a)}
.hero h2{font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.hero h2 em{font-style:normal;color:var(--coral);font-weight:700}
.period{display:flex;align-items:stretch;margin-top:14px;font-size:12px}
.period>span{border:1px solid var(--line);border-radius:6px;padding:4px 8px;line-height:1.2;background:var(--sf)}
.period>span b{display:block;font-size:13px}
.period>span small{color:var(--mut)}
.period>i{flex:1;align-self:center;border-top:1px dashed light-dark(#C9CCD6,#444);position:relative;font-style:normal;text-align:center;color:var(--mut);margin:0 6px}
.period>i span{position:relative;top:-9px;background:var(--sf);padding:0 6px}
.pair{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.pair>div{display:flex;align-items:center;gap:10px}
.pair b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.02em}
.pair small{color:var(--mut);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.pair small i{width:12px;height:12px;border-radius:50%;background:var(--teal);display:inline-grid;place-items:center;color:#fff;font-size:8px;font-style:normal}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-bottom:1px solid var(--line)}
.stepper button{background:none;border:0;padding:10px 4px;font:700 11.5px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center;justify-content:center}
.stepper button.on{color:var(--plum);border-bottom-color:var(--plum)}
.stepper svg.i{width:15px;height:15px}
/* blocos de progresso */
.pbar{margin-top:14px}
.pbar .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;color:var(--plum);margin-bottom:6px}
.pbar .t em{font-style:normal;color:var(--mut);font-weight:500;font-size:12px}
.pbar .m{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:11.5px}
.pbar .m .late{color:var(--coral)}
.pbar .m .lbl{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut);text-transform:uppercase;font-size:10px;letter-spacing:.04em;margin-left:auto}
.big{display:flex;align-items:center;gap:10px}.big .prog{flex:1;height:22px;border-radius:6px}.big b{font-size:13px;color:var(--mut)}
/* rosca */
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut .d{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.donut .d::after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--sf)}
.donut .d b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:22px;color:var(--plum);line-height:1;text-align:center}
.donut .d b small{display:block;font-size:10.5px;color:var(--mut);font-weight:500;margin-top:2px}
.donut ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px;flex:1;min-width:150px}
.donut li{display:flex;align-items:center;gap:8px}.donut li i{width:10px;height:10px;border-radius:3px;flex:none}.donut li em{margin-left:auto;font-style:normal;font-weight:700}
/* fileira de avatares */
.avrow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.avrow>button{background:none;border:0;display:grid;justify-items:center;gap:5px;font:500 12px Inter,sans-serif;color:var(--ink);cursor:pointer;flex:none;width:62px}
.avrow>button span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.sub{font-size:13px;color:var(--mut);margin-top:2px}.sub b{color:var(--ink)}.sub .hl{color:var(--blue);font-weight:600}
.home2{display:grid;gap:12px;margin-top:12px}
/* chamadas para treino */
.simcta{background:linear-gradient(135deg,#5A3672,#3E2550);box-shadow:var(--sh)}
.simcta .mut{color:#D9CBE4}
.simcta>span:first-child{background:var(--grad)!important;color:#fff!important}
.cardvis{background:linear-gradient(135deg,#5A3672,#3E2550)}
.cardvis p[style*="C4A46B"]{color:#F5A28F!important}
.cardvis .lg{color:#ffffff14}
.call{background:linear-gradient(180deg,#3E2550,#1B1124)}
.cb.mic{background:var(--grad);color:#fff}
.cb.on{color:#4A2D5E}
.caption b{color:#F5A28F}
.speaking .wave i{background:#F5A28F}
.avbig::after{border-color:#F5A28F}
.score{color:var(--plum)}
.cal .d.t{background:var(--plum)}
/* computador: menu lateral claro */
@media(min-width:1024px){
 aside.side{background:var(--sf);color:var(--ink);border-right:1px solid var(--line)}
 .sbrand{color:var(--ink)}.sbrand b{color:var(--coral)}

 .si{color:var(--mut)}

 .sgrp{color:light-dark(#9A9EAD,#7d8090);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em}
 .sfoot{border-top-color:var(--line)}
 .sseg{background:var(--sf2)}.sseg button{color:var(--mut)}.sseg button.on{background:var(--sf);color:var(--plum)}
 #app.shell header.top{background:color-mix(in srgb,var(--sf) 94%,transparent)}
 .home2{grid-template-columns:repeat(2,minmax(0,1fr))}
 .home2>.wide{grid-column:1/-1}
 .hero h2{font-size:24px}
}
.donut .d b{display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero .lg{display:none}

.kpi::before{background:var(--plum);opacity:.9}
.prog.g i{background:var(--plum)}
nav.tabs .sim svg{background:var(--plum)}

.cb.mic{background:#E8604C}
.call{background:#2E1C3B}
.hdtit{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0}

.hdbrand b{color:var(--coral);font-weight:600}

/* marca: o P da logo substitui o P de Prumo */
.hdbrand,.sbrand{display:flex;align-items:flex-end;gap:0}
.wm{display:inline-flex;color:var(--plum);flex:none}
.wm svg{width:100%;height:100%}
.hdbrand .wm{width:19px;height:24px;margin:0 1px 2px 4px}
.hdbrand{font-size:20px;line-height:1}
.hdtit{gap:3px;margin-left:4px}
.sbrand{gap:0!important;font-size:20px!important;line-height:1}
.sbrand .wm{width:20px;height:25px;margin:0 1px 2px 0;color:var(--plum)!important}

/* Método Prumo */
.mpl{display:inline-grid;place-items:center;border-radius:10px;background:var(--plum);color:#fff;font-weight:800;flex:none;line-height:1}
.mprow{display:flex;gap:6px;margin-top:8px}
.mprow>span{flex:1;display:grid;justify-items:center;gap:2px;padding:10px 2px;border-radius:12px;background:var(--chip)}
.mprow b{font-size:26px;line-height:1;color:var(--plum);font-weight:800}
.mprow small{font-size:11px;color:var(--mut);font-weight:600}
.mprow.sm>span{padding:6px 2px}.mprow.sm b{font-size:17px}.mprow.sm small{font-size:10px}
.mprow>span:first-child{background:var(--plum)}.mprow>span:first-child b,.mprow>span:first-child small{color:#fff}
.mpstep summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}

.mpstep[open] summary svg.i:last-child{transform:rotate(90deg)}
.mp{border-left:4px solid var(--plum)}
.mphd{display:flex;gap:10px;align-items:center}
.mprev{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--sf2)}

const ACAD=[
 {id:'fund',t:'Fundamentos da liderança',aulas:[
  ['O papel do líder','Liderar é obter resultados por meio de pessoas, sem perder de vista o desenvolvimento delas. O líder equilibra três frentes: tarefa (o que precisa ser entregue), pessoas (quem entrega e como se sente) e contexto (prioridades, recursos e cultura). Quando uma frente domina, as outras sofrem: foco só na tarefa gera desgaste; foco só nas pessoas gera falta de direção.','Liste suas cinco atividades mais frequentes desta semana e marque cada uma como tarefa, pessoas ou contexto. Qual frente está recebendo menos atenção?','Qual é a melhor descrição do papel do líder?',['Fazer as entregas mais difíceis pessoalmente','Obter resultados por meio das pessoas, desenvolvendo-as','Garantir que todos concordem com tudo'],1,'cobranca'],
  ['Liderança situacional','Não existe um estilo único que funcione sempre. O modelo situacional sugere ajustar o quanto você direciona e o quanto você apoia de acordo com a competência e o engajamento da pessoa naquela tarefa específica. Alguém novo e motivado precisa de direção; alguém experiente e inseguro precisa de apoio; alguém experiente e engajado precisa de autonomia.','Escolha um liderado e uma tarefa. Ele precisa mais de direção, de apoio ou de autonomia nela?','No modelo situacional, o estilo do líder depende de:',['Da personalidade do líder','Da competência e do engajamento da pessoa na tarefa','Do cargo da pessoa'],1,'delegacao'],
  ['Confiança se constrói em acordos','A confiança da equipe vem da coerência entre o que você diz e o que faz. Pequenos acordos cumpridos (responder no prazo, comparecer à 1:1, dar o retorno prometido) valem mais que grandes discursos. Quando não puder cumprir, avise antes e renegocie.','Revise os compromissos que você assumiu com a equipe nos últimos 7 dias. Algum precisa ser renegociado hoje?','O que mais constrói confiança na equipe?',['Discursos inspiradores','Coerência entre o que se diz e o que se faz','Evitar assuntos difíceis'],1,'retorno-fb']]},
 {id:'fb',t:'Feedback que transforma',aulas:[
  ['A estrutura SCI','SCI significa Situação, Comportamento e Impacto. Descreva quando e onde aconteceu, o comportamento observável (o que a pessoa fez ou disse, sem julgamentos) e o impacto concreto. Depois, pergunte a percepção da pessoa e construam juntos o próximo passo. Evite rótulos como "você é desorganizado": eles geram defesa e não indicam o que mudar.','Reescreva um feedback recente usando SCI. Retire qualquer adjetivo sobre a pessoa.','Qual frase descreve um comportamento observável?',['Você é muito desatento','Você entregou o relatório dois dias após o prazo combinado','Você não se importa com a equipe'],1,'resist-fb'],
  ['Feedforward','O feedforward foca no futuro: em vez de analisar o erro, pergunta o que pode ser feito de diferente da próxima vez. Reduz a defensividade e aumenta a responsabilidade da pessoa pela solução. Funciona muito bem combinado com SCI: descreva o ocorrido brevemente e invista a maior parte da conversa em ações futuras.','Na próxima conversa de desenvolvimento, faça pelo menos duas perguntas começando com "Da próxima vez...".','O feedforward se concentra principalmente em:',['Analisar os erros do passado','Ações futuras e possibilidades','Registrar ocorrências'],1,'retorno-fb'],
  ['Feedback positivo específico','Elogios genéricos ("bom trabalho!") são esquecidos rapidamente. O reconhecimento específico diz exatamente o que a pessoa fez e por que isso importou, o que aumenta a chance de o comportamento se repetir. Reconheça perto do acontecimento e de forma proporcional.','Envie hoje um reconhecimento específico para alguém da equipe, dizendo o que fez e qual foi o impacto.','O que torna um reconhecimento eficaz?',['Ser feito apenas na avaliação anual','Ser específico sobre o comportamento e o impacto','Ser sempre público'],1,'feedback-positivo']]},
 {id:'com',t:'Comunicação e escuta',aulas:[
  ['Escuta ativa','Escutar ativamente é ouvir para compreender, não para responder. Envolve parafrasear ("então, se entendi bem..."), fazer perguntas abertas e validar o que a pessoa disse antes de apresentar sua visão. Um bom indicador: na conversa, a outra pessoa deve falar mais do que você.','Na próxima conversa, parafraseie a fala do outro pelo menos duas vezes antes de dar sua opinião.','Qual é um sinal de escuta ativa?',['Preparar a resposta enquanto o outro fala','Parafrasear o que foi dito antes de responder','Interromper para ganhar tempo'],1,'desmotivacao'],
  ['Perguntas abertas','Perguntas abertas começam com "como", "o que", "qual" ou "de que forma" e convidam a pessoa a pensar. Perguntas fechadas (respostas sim/não) são úteis para confirmar, mas encerram a reflexão. Cuidado com o "por quê?" em tom de cobrança: pode soar como acusação. Prefira "o que levou a...".','Transforme três perguntas fechadas que você costuma fazer em perguntas abertas.','Qual é uma pergunta aberta?',['Você terminou?','O que dificultou a entrega desta semana?','Está tudo bem?'],1,'atrasos'],
  ['Comunicação Não Violenta','A CNV propõe quatro passos: observação sem julgamento, expressão do sentimento, a necessidade por trás dele e um pedido claro e negociável. Ela ajuda em conversas tensas porque separa fatos de interpretações e transforma críticas em pedidos.','Escreva um pedido que você precisa fazer a alguém usando os quatro passos da CNV.','A sequência da CNV é:',['Crítica, ordem, prazo e punição','Observação, sentimento, necessidade e pedido','Elogio, crítica e elogio'],1,'interrupcoes']]},
 {id:'conf',t:'Conflitos e negociação',aulas:[
  ['Conflito é informação','Conflitos mostram diferenças de interesses, valores ou percepções. Evitá-los costuma piorar a situação. O papel do líder é separar pessoas de problemas, entender os interesses de cada lado (não só as posições) e conduzir a busca de soluções que atendam ao essencial de todos.','Pense num conflito atual. Qual é a posição de cada lado? E qual o interesse por trás dela?','Em um conflito, o líder deve focar em:',['Decidir quem está certo rapidamente','Entender interesses por trás das posições','Esperar que se resolva sozinho'],1,'conflito-pessoas'],
  ['Negociando prioridades','Quando alguém diz "não consigo", em vez de insistir, torne visível a carga de trabalho: o que está em andamento, o que é urgente, o que pode esperar. Negociar prioridades é escolher juntos o que sai ou muda de prazo, não apenas empilhar tarefas.','Liste com um liderado as prioridades da semana e combine explicitamente o que pode esperar.','Uma boa negociação de prioridades:',['Adiciona tarefas sem retirar nenhuma','Torna a carga visível e decide junto o que muda','Evita a conversa e redistribui em silêncio'],1,'prioridades']]},
 {id:'del',t:'Delegação e desenvolvimento',aulas:[
  ['Delegar com clareza','Delegar bem exige combinar: o resultado esperado, o nível de autonomia (decidir sozinho, consultar antes, executar o que foi definido), os recursos disponíveis e quando haverá acompanhamento. Delegar sem acompanhar é abandonar; acompanhar demais é microgerenciar.','Escolha uma tarefa para delegar esta semana e defina por escrito resultado, autonomia e data de acompanhamento.','O que não pode faltar na delegação?',['Fazer a tarefa junto o tempo todo','Clareza de resultado, autonomia e acompanhamento','Delegar apenas tarefas sem importância'],1,'delegacao'],
  ['O modelo 70-20-10','O desenvolvimento profissional acontece em cerca de 70% por experiências práticas, 20% por relações (mentoria, feedback, observação) e 10% por cursos e leituras. Um bom PDI combina os três, com ênfase em desafios reais no trabalho.','Revise um PDI e verifique se ele tem pelo menos uma ação prática, uma relacional e uma de estudo.','No 70-20-10, a maior parte do aprendizado vem de:',['Cursos formais','Experiências práticas','Leituras'],1,'pdi']]},
 {id:'seg',t:'Segurança psicológica',aulas:[
  ['O que é segurança psicológica','É a crença compartilhada de que é seguro arriscar-se na equipe: fazer perguntas, admitir erros e discordar sem medo de punição ou humilhação. Não significa ausência de cobrança, e sim um ambiente em que padrões altos e respeito convivem.','Na próxima reunião, admita um erro seu ou uma dúvida em voz alta e observe a reação da equipe.','Segurança psicológica significa:',['Ninguém é cobrado','É seguro errar, perguntar e discordar com respeito','Todos concordam sempre'],1,'desmotivacao'],
  ['Como reagir a erros','A reação do líder ao primeiro erro define se os próximos serão escondidos. Trate erros como aprendizado: entenda o que aconteceu, o que o processo permitiu e como prevenir. Reserve consequências para negligência e repetição sem esforço de melhoria.','Quando surgir o próximo erro, comece a conversa com "o que aprendemos com isso?".','Diante de um erro, o primeiro passo recomendado é:',['Buscar o culpado','Entender o que aconteceu e o que o processo permitiu','Ignorar para evitar desconforto'],1,'falha-entrega']]}
];

async function aiJSON(prompt,tier){if(!CAP.sample)throw{code:'none',message:noAI};
 try{if(CAP.sample.json)return await CAP.sample.json(prompt,{modelTier:tier||'default'})}catch(e){if(e&&e.code==='not_granted')throw e}

V.mentor=()=>{const lim=S.plano==='Gratuito'?10:null,rhm=soRH();return {t:rhm?'Mentor de Seleção':'Prumo Mentor',act:`<button class="ib" data-a="mentorLimpar" aria-label="Nova conversa">${ic('refresh')}</button>`,h:`
 ${CH().length?'':`<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:44px;height:44px;background:var(--pet);color:#C4A46B">${ic('mentor')}</span><div><h3>${rhm?'Seu mentor de recrutamento e seleção':'Seu mentor de liderança'}</h3><p class="sm mut">${rhm?'Tire dúvidas sobre critérios, entrevistas, devolutivas técnicas, vieses e LGPD em processos seletivos.':'Conte uma situação. Vou ajudar a entender, levantar hipóteses, riscos e alternativas.'}</p></div></div>
 <div class="chips" style="margin-top:14px">${(soRH()?['Como dar devolutiva técnica a um colaborador interno com muito tempo de casa?','O candidato pediu para saber quem foi aprovado. Como responder?','Como transformar "não tem perfil" em um apontamento técnico?','Como explicar ao gestor por que o colaborador dele não passou?']:['Como lidar com um liderado que sempre se justifica?','Fui promovido e lidero ex-colegas. Por onde começo?','Como delegar sem perder qualidade?','Minha equipe está desmotivada. O que investigar?']).map(q=>`<button class="chip" data-a="mentorQ" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`}
 ${rhm?'':`<details class="card" style="margin-bottom:12px"><summary style="cursor:pointer;font-weight:600;font-size:14.5px">Contexto de registros ${mentorCtx&&mentorAuth?`<span class="tag o">${esc(lidN(mentorCtx))}</span>`:'<span class="tag">desligado</span>'}</summary>
  <p class="sm mut" style="margin:8px 0">Opcional. O mentor só usa registros do liderado que você selecionar e autorizar.</p>${lidSel('m_lid',mentorCtx,[['','Nenhum']])}
  <label class="row" style="margin-top:8px;cursor:pointer"><input type="checkbox" id="m_auth" ${mentorAuth?'checked':''} style="width:20px;min-height:20px;flex:none"><span class="sm">Autorizo usar os registros profissionais deste liderado nesta conversa.</span></label></details>`}
 <div class="chat" id="chat">${CH().map((m,i)=>`<div class="msg ${m.r}">${esc(m.t)}${m.r==='a'&&canSpeak()?`<div style="margin-top:6px"><button class="btn sm ghost" style="min-height:32px" data-a="mentorOuvir" data-i="${i}">${ic('spk')} Ouvir</button></div>`:''}</div>`).join('')}</div>
 <div class="composer"><button class="ib" style="background:var(--sf2)" data-a="mentorMic" id="mmic" aria-label="Falar em vez de digitar">${ic('mic')}</button><textarea id="m_in" rows="1" placeholder="Descreva a situação…"></textarea><button class="ib" style="background:var(--pri);color:var(--prit)" data-a="mentorEnviar" aria-label="Enviar">${ic('send')}</button></div>
 <p class="xs mut">${lim?`Plano Gratuito: ${Math.max(0,lim-S.uso.mentor)} de ${lim} mensagens restantes neste mês. `:''}${rhm?'O mentor apoia, mas não substitui o julgamento técnico do avaliador, as normas do CFP ou a orientação jurídica.':'O mentor apoia, mas não substitui decisões de RH, jurídicas ou suas.'}</p>`,
 after(){const s=$('#m_lid'),a=$('#m_auth');if(s)s.onchange=()=>{mentorCtx=s.value;mentorAuth=false;render()};if(a)a.onchange=()=>{mentorAuth=a.checked;render()};const c=$('#chat');if(c&&CH().length)c.lastElementChild.scrollIntoView({block:'end'})}}};
A.mentorQ=d=>{$('#m_in').value=d.q;A.mentorEnviar()};
A.mentorLimpar=()=>{setCH([]);save();render()};
A.mentorOuvir=d=>{speakText(CH()[+d.i].t.slice(0,1990),null)};
let mDict=null;
A.mentorMic=(d,b)=>{const D=CAP.dict;if(!D)return ditado('m_in');if(mDict){D.stop().catch(()=>{});return}mDict=true;b.style.background='var(--our)';const inp=$('#m_in'),base=inp.value?inp.value+' ':'';let fin='';D.onPartial(({text})=>{inp.value=base+fin+text});D.onFinal(({text})=>{fin+=text+' ';inp.value=base+fin});D.onState(({state})=>{if(state==='idle'){mDict=null;b.style.background='var(--sf2)'}});D.start().catch(e=>{mDict=null;b.style.background='var(--sf2)';toast('Microfone não autorizado.')})};
function lidContexto(id){const l=S.lid.find(x=>x.id===id);if(!l)return '';const tl=timeline(id).slice(0,12).map(i=>`- ${i.d} [${CATN[i.cat]||i.cat}] ${i.t}${i.s?': '+String(i.s).slice(0,160):''}`).join('\n');return `Liderado: ${l.nome.split(' ')[0]}, ${l.cargo||''}, área ${l.depto||'-'}, na função desde ${l.funcao||'-'}. Competências em foco: ${(l.comp||[]).join(', ')||'-'}. Observações profissionais: ${l.obs||'-'}.\nRegistros recentes:\n${tl||'nenhum'}`}
A.mentorEnviar=async()=>{if(mentorBusy)return;const inp=$('#m_in'),q=inp.value.trim();if(!q)return;
 if(S.plano==='Gratuito'&&S.uso.mentor>=10)return sheet(`<h3>Limite do plano Gratuito</h3><p class="mut" style="margin:8px 0">Você usou as 10 mensagens do mês.</p><div class="btns"><button class="btn full" data-a="goPlanos">Conhecer o Pro</button></div>`);
 CH().push({r:'u',t:q});inp.value='';render();mentorBusy=true;
 const c=$('#chat'),div=document.createElement('div');div.className='msg a';div.innerHTML='<span class="spin"></span>';c.appendChild(div);div.scrollIntoView({block:'end'});
 const P=S.perfil,ctx=mentorCtx&&mentorAuth?'\n\nContexto autorizado pelo líder:\n'+lidContexto(mentorCtx):'';
 const hist=CH().slice(-10).map(m=>(m.r==='u'?'Líder: ':'Mentor: ')+m.t).join('\n\n');
 const prompt=soRH()?`${ETICA}\n\nVocê é o Mentor de Seleção do Prumo Feedback: especialista em recrutamento e seleção, entrevista por competências (STAR/BEI), definição de critérios e níveis de proficiência, avaliação psicológica em seleção (respeitando as normas do CFP, sem expor dados brutos de testes), devolutivas técnicas para candidatos externos, internos e gestores, redução de vieses e LGPD em processos seletivos. Perfil do usuário: ${P.cargo||'profissional de RH'}, segmento ${P.segmento||'-'}.\n\nPara situações, responda com os títulos: Compreensão:, O que falta saber:, Critérios e evidências a considerar:, Riscos (técnicos, éticos e legais):, Como conduzir:, Exemplo de fala ou texto:, Próximos passos:. Seja técnico e conciso (até 300 palavras). Nunca sugira usar características pessoais protegidas, comparar candidatos na devolutiva ou revelar dados de terceiros. Para dúvidas normativas específicas, oriente a consultar o CRP ou o jurídico.\n\nConversa:\n${hist}\n\nMentor:`:`${ETICA}\n\nVocê é o Prumo Mentor, mentor experiente em liderança situacional, comunicação assertiva, inteligência emocional, conflitos, delegação, motivação, desempenho, mudanças, segurança psicológica, negociação e carreira. Perfil do líder: ${P.cargo||'líder'}, segmento ${P.segmento||'-'}, experiência ${P.exp||'-'}, equipe ${P.equipe||'-'}.${ctx}\n\nPara situações, responda com os títulos: Compreensão:, O que falta saber:, Hipóteses (são apenas hipóteses):, Riscos:, Alternativas:, Sugestão prática:, Exemplo de fala:, Próximos passos:. Seja conciso (até 300 palavras). Para perguntas simples, responda direto e curto. Se o relato envolver assédio, discriminação, violência ou risco legal, oriente a acionar RH ou jurídico.\n\nConversa:\n${hist}\n\nMentor:`;
 try{const t=await ai(prompt,{onText:({text})=>{div.textContent=text;div.scrollIntoView({block:'end'})}});CH().push({r:'a',t});S.uso.mentor++;save()}catch(e){CH().push({r:'a',t:aiErr(e)})}
 mentorBusy=false;render()};

/* ---------- registro por voz ---------- */
let VR={txt:'',res:null,busy:false};
V.voz=()=>{const r=VR.res;return {t:'Registro por voz',h:`
 <p class="mut" style="margin-bottom:14px">Relate o que aconteceu com suas palavras. A IA organiza em um registro, extrai compromissos e datas. Você revisa antes de salvar.</p>
 <div style="text-align:center;margin:10px 0 16px"><button class="cb mic" id="vmic" data-a="vozMic" style="margin:0 auto" aria-label="Gravar relato"><svg viewBox="0 0 24 24">${IC.mic}</svg></button><p class="sm mut" id="vst" style="margin-top:8px">Toque para falar</p></div>
 <label class="f">Relato<textarea id="v_txt" style="min-height:140px" placeholder="Ex.: Hoje o Bruno chegou atrasado de novo na reunião. Conversei com ele e combinamos que até sexta ele me manda uma proposta para reorganizar a agenda.">${esc(VR.txt)}</textarea></label>
 <button class="btn gold full" data-a="vozEstruturar">${VR.busy?'<span class="spin"></span> Organizando…':ic('spark')+' Organizar com IA'}</button>
 ${r?`<div class="sec"><h3>Revise antes de salvar</h3></div><div class="card">
  <label class="f">Tipo de registro${sel('v_tipo',[['ocorrencia','Ocorrência'],['feedback','Feedback (rascunho)'],['reuniao','Reunião realizada'],['reconhecimento','Reconhecimento'],['observacao','Observação'],['plano','Plano de ação']],r.tipo)}</label>
  <label class="f">Liderado${lidSel('v_lid',r.lid||'',[['','Nenhum']])}</label>
  <label class="f">Título<input id="v_tit" value="${esc(r.titulo)}"></label>
  <label class="f">Resumo<textarea id="v_res">${esc(r.resumo)}</textarea></label>
  <label class="f">Data${'<input type="date" id="v_data" value="'+esc(r.data||hoje())+'">'}</label>
  <p style="font-size:14px;font-weight:500;margin-bottom:6px">Compromissos detectados</p>
  ${(r.compromissos||[]).length?r.compromissos.map((c,i)=>`<label class="row" style="margin-bottom:6px;cursor:pointer"><input type="checkbox" id="v_c${i}" checked style="width:20px;min-height:20px;flex:none"><span class="grow sm">${esc(c.texto)}${c.prazo?` · <b>${esc(fd(c.prazo))}</b>`:''}</span></label>`).join(''):'<p class="sm mut">Nenhum.</p>'}
  ${(r.proximos||[]).length?`<p style="font-size:14px;font-weight:500;margin:10px 0 6px">Próximos passos sugeridos</p><ul class="sm" style="margin:0;padding-left:18px">${r.proximos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  <div class="btns"><button class="btn line" data-a="vozDescartar">Descartar</button><button class="btn" style="flex:1" data-a="vozSalvar">Salvar registro</button></div></div>`:''}
 <p class="note">O áudio não é armazenado: apenas o texto que você revisar e salvar. Priorize seus próprios relatos; não grave terceiros sem consentimento.</p>`}};
let vDict=null;
A.vozMic=(d,b)=>{const D=CAP.dict;if(!D)return ditado('v_txt');if(vDict){D.stop().catch(()=>{});return}vDict=true;b.classList.add('rec');$('#vst').textContent='Ouvindo… toque para parar';const ta=$('#v_txt'),base=ta.value?ta.value+' ':'';let fin='';D.onPartial(({text})=>{ta.value=base+fin+text});D.onFinal(({text})=>{fin+=text+' ';ta.value=base+fin;VR.txt=ta.value});D.onState(({state})=>{if(state==='idle'){vDict=null;b.classList.remove('rec');const s=$('#vst');if(s)s.textContent='Toque para continuar falando'}});D.start().catch(()=>{vDict=null;b.classList.remove('rec');toast('Microfone não autorizado.')})};
A.vozEstruturar=async()=>{VR.txt=val('v_txt');if(!VR.txt)return toast('Fale ou digite o relato primeiro.');VR.busy=true;render();
 const nomes=ativos().map(l=>l.nome).join(', ')||'nenhum';
 try{const j=await aiJSON(`${ETICA}\n\nHoje é ${hoje()}. Liderados cadastrados: ${nomes}.\nTransforme o relato do líder em um registro estruturado. Use somente fatos do relato. Datas relativas ("sexta", "amanhã") devem virar datas AAAA-MM-DD a partir de hoje.\nRetorne JSON: {"tipo":"ocorrencia|feedback|reuniao|reconhecimento|observacao|plano","liderado":"nome exato da lista ou vazio","titulo":"até 70 caracteres","resumo":"texto objetivo em terceira pessoa, comportamentos observáveis","data":"AAAA-MM-DD","compromissos":[{"texto":"","prazo":"AAAA-MM-DD ou vazio"}],"proximos":["próximo passo sugerido"]}\n\nRelato: """${VR.txt}"""`);
  const l=ativos().find(x=>j.liderado&&x.nome.toLowerCase()===String(j.liderado).toLowerCase())||ativos().find(x=>j.liderado&&x.nome.toLowerCase().startsWith(String(j.liderado).toLowerCase().split(' ')[0]));
  VR.res={tipo:j.tipo||'observacao',lid:l?l.id:'',titulo:String(j.titulo||'Registro').slice(0,90),resumo:String(j.resumo||VR.txt),data:/^\d{4}-\d\d-\d\d$/.test(j.data)?j.data:hoje(),compromissos:(Array.isArray(j.compromissos)?j.compromissos:[]).filter(c=>c&&c.texto).map(c=>({texto:String(c.texto),prazo:/^\d{4}-\d\d-\d\d$/.test(c.prazo)?c.prazo:''})),proximos:(Array.isArray(j.proximos)?j.proximos:[]).map(String).slice(0,4)}}
 catch(e){VR.res={tipo:'observacao',lid:'',titulo:VR.txt.slice(0,60),resumo:VR.txt,data:hoje(),compromissos:[],proximos:[]};toast(CAP.sample?'Não consegui organizar; revise manualmente.':'IA indisponível: revise e salve manualmente.')}
 VR.busy=false;render()};
A.vozDescartar=()=>{VR={txt:'',res:null,busy:false};render()};
A.vozSalvar=()=>{const r=VR.res,tipo=val('v_tipo'),lid=val('v_lid')||null,tit=val('v_tit'),res=val('v_res'),data=val('v_data')||hoje();
 if(tipo==='reconhecimento')S.rec.push({id:nid(),lid,cat:'Comprometimento',texto:tit,msg:res,data});
 else if(tipo==='reuniao')S.reun.push({id:nid(),lid,modelo:'Semanal',data,hora:'',recorr:'',pauta:'',notas:{assuntos:res},ata:'',status:'concluida'});
 else S.ev.push({id:nid(),tipo,lid,data,titulo:tit,texto:res,status:tipo==='feedback'?'rascunho':'registrado',metodo:tipo==='feedback'?'SCI':undefined});
 (r.compromissos||[]).forEach((c,i)=>{if(val('v_c'+i))S.ev.push({id:nid(),tipo:'compromisso',lid,data,prazo:c.prazo||addD(7),titulo:c.texto,texto:'Extraído do registro por voz',status:'pendente'})});
 save();VR={txt:'',res:null,busy:false};toast('Registro salvo');render()};

/* ---------- reuniões 1:1 ---------- */
V.reunioes=()=>{const ag=S.reun.filter(r=>r.status==='agendada').sort((a,b)=>a.data.localeCompare(b.data)),fe=S.reun.filter(r=>r.status==='concluida').sort((a,b)=>b.data.localeCompare(a.data));
 const row=r=>`<button class="row" data-a="go" data-v="reunVer" data-id="${r.id}">${avatar(lidN(r.lid),40)}<span class="grow"><b style="font-weight:600">${esc(lidN(r.lid)||'Liderado')}</b><br><span class="sm mut">${esc(r.modelo)} · ${esc(fd(r.data))}${r.hora?' '+esc(r.hora):''}${r.recorr?' · '+esc(r.recorr):''}</span></span>${ic('chev')}</button>`;
 return {t:'Reuniões 1:1',act:`<button class="ib" data-a="go" data-v="reunEdit" aria-label="Nova reunião">${ic('plus')}</button>`,h:`<div class="sec" style="margin-top:0"><h3>Agendadas</h3></div>${ag.length?`<div class="list">${ag.map(row).join('')}</div>`:empty('cal','Nenhuma reunião agendada.')}<div class="sec"><h3>Realizadas</h3></div>${fe.length?`<div class="list">${fe.map(row).join('')}</div>`:'<p class="mut sm">Nenhuma ainda.</p>'}`}};
V.reunEdit=p=>{const r=S.reun.find(x=>x.id===p.id)||{lid:p.lid||'',modelo:'Mensal',data:addD(2),hora:'10:00',recorr:''};return {t:p.id?'Editar reunião':'Nova reunião 1:1',h:`
 <label class="f">Liderado${lidSel('r_lid',r.lid,[['','Selecione']])}</label><label class="f">Modelo${sel('r_mod',MODELOS_1A1,r.modelo)}</label>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="f">Data<input type="date" id="r_data" value="${esc(r.data)}"></label><label class="f">Hora<input type="time" id="r_hora" value="${esc(r.hora)}"></label></div>
 <label class="f">Recorrência${sel('r_rec',[['','Não repetir'],'Semanal','Quinzenal','Mensal'],r.recorr)}</label>
 <button class="btn full" data-a="reunSalvar" data-id="${p.id||''}">Salvar</button>`}};
A.reunSalvar=d=>{const lid=val('r_lid');if(!lid)return toast('Selecione o liderado.');const o={lid,modelo:val('r_mod'),data:val('r_data')||hoje(),hora:val('r_hora'),recorr:val('r_rec')};
 if(d.id){Object.assign(S.reun.find(x=>x.id===d.id),o);save();back()}else{const id=nid();S.reun.push({id,...o,pauta:'',notas:{},ata:'',status:'agendada'});save();stack.pop();go('reunVer',{id})}};
V.reunVer=p=>{const r=S.reun.find(x=>x.id===p.id);if(!r)return {t:'Reunião',h:''};const n=r.notas||{},done=r.status==='concluida';
 const F=[['assuntos','Assuntos tratados'],['percepcoes','Percepções relatadas pela pessoa'],['dificuldades','Dificuldades'],['positivos','Pontos positivos'],['decisoes','Decisões, responsáveis e prazos']];
 return {t:'1:1 com '+(lidN(r.lid).split(' ')[0]||'liderado'),act:`<button class="ib" data-a="go" data-v="reunEdit" data-id="${r.id}" aria-label="Editar">${ic('edit')}</button>`,h:`
 <p class="mut sm">${esc(r.modelo)} · ${esc(fdl(r.data))}${r.hora?' às '+esc(r.hora):''}${r.recorr?' · repete '+esc(r.recorr.toLowerCase()):''}</p> <span class="tag ${done?'o':''}">${done?'Realizada':'Agendada'}</span>
 <div class="sec"><h3>Pauta</h3><button class="btn sm gold" data-a="reunPauta" data-id="${r.id}">${ic('spark')} Preparar com IA</button></div>
 <textarea id="r_pauta" style="min-height:120px" placeholder="Tópicos da conversa">${esc(r.pauta)}</textarea>
 <details class="card" style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Banco de perguntas abertas</summary><div class="list" style="margin-top:10px">${PERGUNTAS_1A1.map(q=>`<button class="row" style="min-height:44px" data-a="reunAddQ" data-q="${esc(q)}"><span class="grow sm">${esc(q)}</span>${ic('plus')}</button>`).join('')}</div></details>
 <div class="sec"><h3>Registro da conversa</h3></div>
 ${F.map(f=>`<label class="f">${f[1]}<textarea id="rn_${f[0]}">${esc(n[f[0]]||'')}</textarea></label>`).join('')}
 <label class="f">Próxima reunião<input type="date" id="r_prox" value="${esc(r.prox||'')}"></label>
 <div class="btns"><button class="btn line" style="flex:1" data-a="reunNotas" data-id="${r.id}">Salvar</button><button class="btn" style="flex:1" data-a="reunConcluir" data-id="${r.id}">${done?'Atualizar':'Concluir reunião'}</button></div>
 <div class="sec"><h3>Ata e plano de ação</h3><button class="btn sm gold" data-a="reunAta" data-id="${r.id}">${ic('spark')} Gerar</button></div>
 <div class="card out" id="r_ata">${r.ata?esc(r.ata):'<span class="mut">Preencha o registro e gere a ata, o resumo e o plano de ação.</span>'}</div>
 ${r.ata?`<div class="btns"><button class="btn sm ghost" data-a="reunCopy" data-id="${r.id}">${ic('copy')} Copiar ata</button></div>`:''}
 <button class="simcta" style="margin-top:16px" data-a="go" data-v="simConfig" data-cen="${r.modelo==='Carreira'?'carreira':r.modelo==='Desempenho'?'desempenho':r.modelo==='Integração'?'integracao':r.modelo==='Desenvolvimento'?'pdi':'retorno-fb'}"><span style="width:44px;height:44px;border-radius:14px;background:#C4A46B;display:grid;place-items:center;color:#123D3B;flex:none">${ic('sim')}</span><span style="flex:1"><b>Praticar esta reunião</b><br><span class="mut sm">Ensaie por voz ou vídeo antes.</span></span></button>
 <button class="btn danger full" style="margin-top:16px" data-a="reunDel" data-id="${r.id}">Excluir reunião</button>`}};
function reunRead(r){r.pauta=val('r_pauta');r.notas=r.notas||{};['assuntos','percepcoes','dificuldades','positivos','decisoes'].forEach(k=>r.notas[k]=val('rn_'+k));r.prox=val('r_prox')}
A.reunAddQ=d=>{const t=$('#r_pauta');t.value=(t.value?t.value.trimEnd()+'\n':'')+d.q;toast('Pergunta adicionada à pauta')};
A.reunNotas=d=>{const r=S.reun.find(x=>x.id===d.id);reunRead(r);save();toast('Salvo')};
A.reunConcluir=d=>{const r=S.reun.find(x=>x.id===d.id);reunRead(r);const was=r.status;r.status='concluida';
 const nx=r.prox||(r.recorr?addD(r.recorr==='Semanal'?7:r.recorr==='Quinzenal'?14:30,r.data):'');
 if(was!=='concluida'&&nx&&!S.reun.some(x=>x.lid===r.lid&&x.status==='agendada'))S.reun.push({id:nid(),lid:r.lid,modelo:r.modelo,data:nx,hora:r.hora,recorr:r.recorr,pauta:'',notas:{},ata:'',status:'agendada'});

A.simTr=d=>{const s=S.sims.find(x=>x.id===d.id),p=persBy(s.pers);sheet(`<h3>Transcrição</h3><div class="chat" style="margin:12px 0">${(s.turns||[]).map(t=>`<div class="msg ${t.w==='u'?'u':'a'}">${esc(t.t)}</div>`).join('')||'<p class="mut">Sem transcrição.</p>'}</div><div class="btns"><button class="btn line" data-a="simTrDel" data-id="${s.id}">Excluir transcrição</button><button class="btn" style="flex:1" data-a="closeSheet">Fechar</button></div>`)};

V.simHist=()=>{const L=[...S.sims].reverse(),ok=S.sims.filter(s=>s.crit);const avg=k=>ok.length?Math.round(ok.reduce((a,s)=>a+s.crit[k],0)/ok.length/CRIT.find(c=>c[0]===k)[2]*100):0;
 return {t:'Histórico e evolução',h:`${ok.length?`<div class="card"><h3>Evolução por competência</h3><p class="xs mut" style="margin:2px 0 12px">Média das ${ok.length} simulações avaliadas</p><div class="bars">${CRIT.map(([k,n])=>`<div class="r"><span>${n.split(' ')[0]}</span><div class="prog"><i style="width:${avg(k)}%"></i></div><em>${avg(k)}%</em></div>`).join('')}</div>
 <h3 style="margin-top:16px">Notas ao longo do tempo</h3><div style="display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px">${ok.slice(-12).map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><span class="xs">${s.nota}</span><div style="width:100%;max-width:28px;height:${s.nota*.8}px;background:var(--ver);border-radius:6px 6px 0 0"></div></div>`).join('')}</div></div>`:''}
 <div class="sec"><h3>Tentativas</h3></div>${L.length?`<div class="list">${L.map(s=>{const c=cenBy(s.cen)||{titulo:s.cenT||'Cenário'};return `<button class="row" data-a="go" data-v="simRel" data-id="${s.id}">${face(persBy(s.pers),40)}<span class="grow"><b style="font-weight:600">${esc(c.titulo)}</b><br><span class="xs mut">${esc(fd(s.data))} · ${s.modo==='video'?'Vídeo':'Voz'} · ${esc((NIVEIS.find(n=>n.id===s.nivel)||{}).nome||'')}</span></span><b style="color:var(--pri)">${s.nota??'–'}</b></button>`}).join('')}</div>`:empty('sim','Nenhuma simulação ainda.',`<button class="btn" style="margin-top:12px" data-a="tab" data-v="simula">Fazer a primeira</button>`)}`}};

const GLOSS={

 'CNV':{t:'Comunicação Não Violenta (CNV)',o:'Método para conversas tensas em 4 passos: observar o fato, dizer como você se sente, explicar a necessidade e fazer um pedido claro.',q:'Quando há emoção envolvida, conflito ou risco de a pessoa se sentir atacada.',e:'"Quando o relatório chega depois do prazo (fato), fico preocupado (sentimento), porque preciso dele para a diretoria (necessidade). Podemos combinar quinta às 12h? (pedido)"'},

 'GROW':{t:'GROW',o:'Roteiro de conversa em 4 etapas: Objetivo (o que se quer), Realidade (onde está hoje), Opções (caminhos possíveis) e Vontade/próximos passos (o que será feito).',q:'Conversas de desenvolvimento, carreira e para ajudar a pessoa a achar a própria solução.',e:'Objetivo: liderar um projeto · Realidade: nunca liderou · Opções: piloto pequeno · Próximo passo: apresentar plano até dia 15.'},

 '5W2H':{t:'5W2H',o:'Checklist para detalhar um plano: O quê, Por quê, Onde, Quando, Quem, Como e Quanto custa.',q:'Quando o PDI ou o plano de ação precisa de muitos detalhes práticos.',e:'O quê: curso · Por quê: falar melhor em público · Onde: online · Quando: março · Quem: Carla · Como: 1h por semana · Quanto: R$ 300.'},

function infoBtn(k){return `<button type="button" class="qi" data-a="info" data-k="${esc(k)}" aria-label="O que é ${esc(k)}?">?</button>`}
A.info=d=>{const g=GLOSS[d.k];if(!g)return;sheet(`<span class="tag">Glossário</span><h2 style="margin-top:8px">${esc(g.t)}</h2><p style="margin-top:10px;line-height:1.6">${esc(g.o)}</p>${g.q?`<p class="xs mut" style="margin-top:14px">Quando usar</p><p>${esc(g.q)}</p>`:''}${g.e&&g.e!=='—'?`<div class="card ai" style="margin-top:14px"><p class="xs mut">Exemplo</p><p>${esc(g.e)}</p></div>`:''}<div class="btns"><button class="btn full" data-a="closeSheet">Entendi</button></div>`)};
A.ajuda=d=>{const h=AJUDA[d.v];if(!h)return;sheet(`<span class="tag">Como funciona</span><h2 style="margin-top:8px">${esc(h[0])}</h2><p style="margin-top:10px;line-height:1.6">${esc(h[1])}</p><ol style="margin:14px 0 0;padding-left:20px;line-height:1.7">${h[2].map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${h[3]&&h[3]!=='—'?`<div class="card ai" style="margin-top:14px"><p class="xs mut">Dica</p><p>${esc(h[3])}</p></div>`:''}<div class="btns"><button class="btn line" data-a="glossAbrir">Ver glossário</button><button class="btn" style="flex:1" data-a="closeSheet">Entendi</button></div>`)};
A.glossAbrir=()=>{closeSheet();go('glossario')};
A.introOk=d=>{S.cfg.vistos=S.cfg.vistos||{};S.cfg.vistos[d.v]=1;save();const c=$('#intro');if(c)c.remove()};
A.introOff=()=>{S.cfg.dicas=false;save();const c=$('#intro');if(c)c.remove();toast('Introduções desligadas. Use o "?" no topo quando precisar.')};
let glQ='';
V.glossario=()=>{const L=Object.entries(GLOSS).filter(([k,g])=>visivel(g)).filter(([k,g])=>!glQ||(g.t+' '+g.o).toLowerCase().includes(glQ.toLowerCase())).sort((a,b)=>a[1].t.localeCompare(b[1].t));return {t:'Guia e glossário',h:`<input id="glq" placeholder="Buscar termo (ex.: SMART, 1:1, indicador)" value="${esc(glQ)}" style="margin-bottom:12px">
 <div class="list">${L.map(([k,g])=>`<button class="row" data-a="info" data-k="${esc(k)}"><span class="grow"><b style="font-weight:600">${esc(g.t)}</b><br><span class="sm mut">${esc(g.o.slice(0,95))}${g.o.length>95?'…':''}</span></span>${ic('chev')}</button>`).join('')||empty('search','Nenhum termo encontrado.')}</div>
 <div class="sec"><h3>Guias das telas</h3></div><div class="list">${(soRH()?GUIAS_RH:temRH()?[...new Set([...GUIAS_LIDER,...GUIAS_RH])]:GUIAS_LIDER).map(v=>`<button class="row" data-a="ajuda" data-v="${v}"><span style="color:var(--pri)">${ic('help')}</span><span class="grow">${esc(AJUDA[v][0])}</span>${ic('chev')}</button>`).join('')}</div>`,
 after(){const q=$('#glq');q.oninput=()=>{glQ=q.value;const p=q.selectionStart;render();const n=$('#glq');n.focus();n.setSelectionRange(p,p)}}}};

function enhance(v){
 const main=$('main');if(!main)return;
 // introdução da tela na primeira visita
 const h=AJUDA[v];if(h&&S.cfg.dicas!==false&&!(S.cfg.vistos||{})[v]&&v!=='glossario'){const d=document.createElement('div');d.id='intro';d.className='card intro';d.innerHTML=`<div style="display:flex;gap:10px;align-items:flex-start"><span style="color:var(--acc)">${ic('bulb')}</span><div style="flex:1"><b>${esc(h[0])}: como funciona</b><p class="sm" style="margin-top:4px">${esc(h[1])}</p><ul class="sm mut" style="margin:8px 0 0;padding-left:18px;line-height:1.6">${h[2].map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div></div><div class="btns" style="margin-top:10px"><button class="btn sm" data-a="introOk" data-v="${v}">Entendi</button><button class="btn sm ghost" data-a="introOff">Não mostrar mais</button></div>`;main.prepend(d)}
 // dicas e botões de explicação nos campos
 main.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{const id=el.id,lab=el.closest('label.f');if(!lab||lab.dataset.enh)return;lab.dataset.enh=1;
  if(INFO_ID[id]){const tn=[...lab.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());const s=document.createElement('span');s.style.cssText='display:flex;align-items:center;gap:6px';s.textContent=tn?tn.textContent:'';if(tn)tn.replaceWith(s);s.insertAdjacentHTML('beforeend',infoBtn(INFO_ID[id]))}
  if(HINTS[id]){const hn=document.createElement('span');hn.className='hint';hn.textContent=HINTS[id];el.insertAdjacentElement('afterend',hn)}
  if(DYN[id]&&el.tagName==='SELECT'){const box=document.createElement('span');box.className='dyn';const upd=()=>{const t=DYN[id][el.value];box.textContent=t||'';box.style.display=t?'block':'none';if(id==='p_met'){const q=lab.querySelector('.qi');if(q)q.dataset.k=el.value}};(lab.querySelector('.hint')||el).insertAdjacentElement('afterend',box);el.addEventListener('change',upd);upd()}});
 // tons do feedback
 const tom=$('#f_tom');if(tom&&!$('#tomd')){const b=document.createElement('p');b.id='tomd';b.className='dyn';tom.insertAdjacentElement('afterend',b);const upd=()=>{const s=tom.querySelector('.chip.on');b.textContent=s?TONS_D[s.dataset.val]||'':''};tom.addEventListener('click',()=>setTimeout(upd,0));upd()}
 // exemplos nas metodologias de feedback
 main.querySelectorAll('input[name=f_met]').forEach(r=>{const m=METODOS.find(x=>x.id===r.value),row=r.closest('.row');if(m&&row&&!row.querySelector('.mex')){const g=row.querySelector('.grow');g.insertAdjacentHTML('beforeend',`<br><span class="xs mut mex"><i>Ex.: ${esc(m.ex)}</i></span>`);row.insertAdjacentHTML('beforeend',infoBtn(m.id))}});
 // dificuldade
 main.querySelectorAll('input[name=sc_n]').forEach((r,i)=>{if(i===0){const sec=r.closest('.list').previousElementSibling;if(sec&&!sec.querySelector('.qi'))sec.querySelector('h3').insertAdjacentHTML('beforeend',' '+infoBtn('Dificuldade'))}});
}

Estruture com estes títulos exatos, cada um em sua linha:

ACAD.unshift(
 {id:'metodo',t:'Método Prumo',p:'lider',aulas:[
  ['P · Pensar antes','Antes de qualquer conversa difícil, o líder já carrega uma história sobre a pessoa ("ele não se importa", "não vai adiantar"). Na Terapia Cognitivo-Comportamental, esses são pensamentos automáticos: surgem rápido, parecem verdade e influenciam emoção e comportamento. Se você entra na conversa com um rótulo, ele aparece no tom, na escolha das palavras e na pouca disposição para ouvir. A etapa P é um minuto de revisão: o que eu vi? o que estou supondo? que outra explicação seria possível? estou calmo o bastante?','Pense em alguém com quem você precisa conversar. Escreva o que pensa sobre essa pessoa e marque o que é fato e o que é interpretação.','Qual é o objetivo da etapa P?',['Decidir a punição antes da conversa','Separar fatos de interpretações e checar o próprio estado emocional','Ensaiar um discurso para não ser interrompido'],1,'resist-fb'],
  ['R · Relatar o fato','Relatar é descrever o comportamento observável, quando aconteceu e qual foi o impacto. Na análise funcional, olhamos o antecedente (o que veio antes), o comportamento e a consequência. "Você é desorganizado" ataca a identidade e gera defesa; "o relatório de terça chegou sem os dados de vendas e o cliente pediu reenvio" descreve um fato que pode ser discutido. Evite "sempre" e "nunca": quase nunca são literais.','Reescreva a frase "Você nunca se compromete com nada" como um relato de fato com situação, comportamento e impacto.','Qual frase é um relato de fato?',['Você é muito desatento','Você sempre esquece tudo','Na reunião de ontem, os números do slide 3 estavam desatualizados e o diretor questionou'],2,'falha-entrega'],
  ['U · Unir perspectivas','Depois do fato, pergunte antes de concluir. O questionamento socrático usa perguntas abertas para que a pessoa examine a situação e chegue às próprias conclusões, o que aumenta a responsabilização. Perguntas como "como você enxerga isso?" e "o que estava acontecendo?" trazem contexto que você não tinha. Devolva o que entendeu ("então o prazo mudou e ninguém te avisou?") antes de seguir.','Liste três perguntas abertas que você poderia fazer na sua próxima conversa difícil.','Qual é uma pergunta no estilo socrático?',['Você não acha que errou?','O que estava acontecendo naquele momento?','Por que você fez isso de novo?'],1,'atrasos'],
  ['M · Mudança combinada','Uma conversa sem acordo vira desabafo. Na etapa M, convide a pessoa a propor a mudança ("o que você propõe a partir de agora?") e torne o acordo específico: o quê, como, até quando e com qual apoio seu. "Vou melhorar" não é acordo; "vou enviar o rascunho na quinta para revisão antes de mandar ao cliente" é.','Transforme "vou me esforçar mais" em um acordo específico com prazo e apoio.','Qual é um acordo bem definido?',['Vou prestar mais atenção','Vou tentar melhorar a comunicação','Até sexta, vou enviar o status do projeto às 17h para a equipe, e você revisa o formato comigo na primeira semana'],2,'resist-fb'],
  ['O · Observar e acompanhar','Comportamentos reconhecidos tendem a se repetir: é o princípio do reforço positivo. Se o líder combina e nunca mais retoma, comunica que o assunto não era importante. Marque o retorno ao final da conversa, observe o comportamento combinado e reconheça o progresso, mesmo parcial. Se não houve mudança, volte ao R com o novo fato.','Agende agora um acompanhamento para o último feedback que você deu.','Por que reconhecer o progresso parcial?',['Para evitar conflitos','Porque o reforço aumenta a chance de o comportamento se repetir','Porque é obrigatório pela CLT'],1,'atrasos']]},
 {id:'metodo-rh',t:'Método Prumo nas devolutivas',p:'rh',aulas:[
  ['P · Pensar antes: vieses do avaliador','Toda avaliação passa por um julgamento humano, sujeito a vieses: efeito halo, primeira impressão, similaridade, contraste, confirmação e tendência central. A etapa P é revisar se cada conclusão está presa a um critério da vaga e a uma evidência, e não a uma impressão geral. Pergunta útil: eu chegaria à mesma conclusão sem os primeiros cinco minutos da entrevista?','Revise sua última reprovação e verifique se cada critério tem uma evidência registrada.','O que é o efeito contraste?',['Julgar comparando com o candidato anterior, e não com o perfil da vaga','Avaliar melhor quem se parece com você','Dar notas medianas para todos'],0,'dv-contesta'],
  ['R · Relatar critérios e evidências','A devolutiva técnica responde, para cada critério: o que a vaga exigia, o nível esperado, o que foi observado (em qual etapa e instrumento) e a evidência concreta. "Não teve perfil" não informa nada e não se sustenta. Escores brutos de testes psicológicos e comparações com outros candidatos não entram.','Reescreva "faltou perfil de liderança" como um relato técnico com critério, nível esperado, observado e evidência.','Qual trecho é técnico?',['Não gostamos muito da sua postura','Para o critério negociação, esperava-se nível 3; no estudo de caso, a proposta não apresentou alternativas ao cliente','Você não tem o perfil da empresa'],1,'dv-frustrado'],
  ['U · Unir perspectivas','Depois do resultado, abra espaço: "como você recebe isso?". Acolher não é reabrir a decisão. É reconhecer a frustração, esclarecer dúvidas sobre os critérios e ouvir o que a pessoa percebeu. Quem se sente ouvido aceita melhor um resultado, mesmo discordando.','Escreva como você responderia a "mas eu tenho mais experiência que o exigido".','Como reagir quando o candidato contesta?',['Reabrir a avaliação na hora','Acolher, retomar o critério não atendido com a evidência e manter a decisão com respeito','Dizer quem foi aprovado para comparar'],1,'dv-contesta'],
  ['M · Mudança: recomendações','As lacunas viram recomendações concretas e realistas, ligadas aos critérios: um curso, uma experiência, uma prática. Recomendações genéricas ("continue se desenvolvendo") não ajudam. Para candidatos internos, elas podem virar um PDI.','Escreva duas recomendações específicas para um critério não atendido.','Qual é uma boa recomendação?',['Continue se esforçando','Pratique apresentações de 5 minutos com dados e peça devolutiva a um colega, por 30 dias','Procure ter mais perfil'],1,'dv-interno'],
  ['O · Orientar os próximos passos','Encerre com clareza: banco de talentos, possibilidade de novos processos, por quanto tempo os dados ficam guardados (LGPD) e, no caso interno, quem acompanha o plano de desenvolvimento e como o gestor será envolvido.','Monte o encerramento padrão da sua equipe para devolutivas externas.','O que deve constar no encerramento?',['Próximos passos, situação no banco de talentos e uso dos dados','O nome de quem foi aprovado','A nota bruta dos testes'],0,'dv-gestor']]});
